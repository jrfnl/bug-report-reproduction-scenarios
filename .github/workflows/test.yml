name: Test

on:
  # Run on relevant pushes to select branches and on all relevant pull requests.
  push:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plain:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php_version: ["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]

    name: "Single install: PHP ${{ matrix.php_version }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          coverage: none

  pob:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php_version: ["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]

    name: "Double install: PHP ${{ matrix.php_version }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP 7.2 for a specific task
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.2
          coverage: none

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          coverage: none
        env:
          update: true
